{% extends "base.html" %}
{% block title %}Error — Ward Water Quality Reporter{% endblock %}

{% block content %}
<div class="error-page">
  <div class="error-icon">🚫</div>
  <h1>Something went wrong</h1>
  <div class="alert alert-danger" style="max-width:600px;margin:1.5rem auto;">
    {{ error | safe }}
  </div>
  <p>Please fix the issue above and restart the server.</p>
  <a href="{{ url_for('home') }}" class="btn btn-primary">← Try Again</a>
</div>
{% endblock %}
